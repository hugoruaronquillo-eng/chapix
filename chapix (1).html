<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CHAPIX</title>
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{background:#0a1f12;color:#fff;font-family:system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh}
#hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:#111c16;border-bottom:2px solid #1f3a2a}
#hud.hide{visibility:hidden}
.team{font-weight:800;font-size:clamp(14px,3.2vw,26px);letter-spacing:1px;display:flex;align-items:center;gap:10px}
.team span{max-width:24vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team b{font-size:clamp(22px,5vw,40px);background:#000a;border-radius:8px;padding:0 12px;min-width:1.6em;text-align:center}
.blue{color:#6db3ff}.red{color:#ff7b7b}
#mid{text-align:center;flex:1}
#time{font-size:clamp(20px,4.5vw,32px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
#turn{font-size:clamp(11px,2.4vw,16px);font-weight:700;padding:2px 10px;border-radius:12px;display:inline-block;margin:2px 0;background:#000a}
#row{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px;color:#bcd}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:8px 14px;background:#ffd60a;color:#222;cursor:pointer}
button:active{transform:scale(.96)}
button.sm{padding:3px 10px;font-size:12px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
canvas{touch-action:none;display:block}
.screen{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
background:radial-gradient(ellipse at center,#031a0a99 0%,#010a05ee 100%);opacity:0;visibility:hidden;transform:scale(.96);transition:opacity .3s,transform .3s,visibility .3s}
.screen.on{opacity:1;visibility:visible;transform:none}
.screen h1{font-family:Impact,'Arial Black',sans-serif;font-style:italic;font-size:clamp(38px,10vw,92px);letter-spacing:2px;text-shadow:0 4px 0 #0a5,0 8px 18px #000}
.screen h1 span{color:#ffd60a}
.screen h2{font-size:clamp(24px,6vw,44px)}
.screen p{font-size:clamp(14px,3vw,20px);opacity:.85}
.screen button{width:min(330px,82vw);padding:14px;font-size:clamp(16px,3.6vw,22px);text-transform:uppercase;letter-spacing:1px;box-shadow:0 5px 0 #a08400}
.screen button.alt{background:#2a4d36;color:#fff;box-shadow:0 5px 0 #14291c}
.screen button:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
#endT{font-size:clamp(28px,7vw,60px)}
#endS{font-size:clamp(20px,5vw,36px);font-weight:700;opacity:1}
/* ---- Menú principal: cuadrícula 2x2 + botón de ajustes ---- */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2.4vw,18px);width:min(640px,92vw)}
.screen .mgrid button{width:100%;padding:14px 8px;font-size:clamp(14px,3.4vw,22px);white-space:nowrap}
#menu #gear{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:48px;height:48px;padding:0;border-radius:50%;font-size:26px;line-height:1;letter-spacing:0;box-shadow:0 4px 0 #14291c}
@media (max-height:380px){#menu h1{font-size:clamp(30px,9vh,44px)}#menu p{display:none}}
/* ---- Torneo ---- */
.screen.tall{justify-content:flex-start;gap:8px;padding:12px 10px}
.screen.tall h2{font-size:clamp(20px,4.5vw,32px)}
.screen.tall button{padding:10px;font-size:clamp(14px,3vw,18px)}
.screen h3{font-size:13px;letter-spacing:1px;opacity:.8;margin:10px 0 5px;text-transform:uppercase}
.scroll{overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;width:min(960px,100%);flex:1;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{padding:7px 12px;border-radius:18px;background:#14291c;border:2px solid #1f3a2a;font-weight:700;cursor:pointer;font-size:14px}
.chip.on{background:#ffd60a;color:#222;border-color:#ffd60a}
#tgrid,#sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;padding:2px}
.tc{position:relative;background:#14291c;border:3px solid #1f3a2a;border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:13px}
.tc .fg{font-size:30px;line-height:1}
.tc i{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 2px #fffa}
.tc small{position:absolute;top:3px;left:6px;opacity:.6;font-size:11px}
.tc.sel{border-color:#ffd60a;background:#2a4d36;box-shadow:0 0 14px #ffd60a99}
.tc.sel::after{content:"✓";position:absolute;top:1px;right:6px;color:#ffd60a;font-weight:900}
.brow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(660px,100%)}
.brow button{width:auto;flex:1 1 150px}
#bk{display:flex;gap:16px;padding:8px;min-width:max-content;align-items:stretch;height:100%;min-height:900px;flex-shrink:0}
.rc{display:flex;flex-direction:column;width:175px}
.rc h4{text-align:center;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#ffd60a;margin-bottom:4px}
.rc .ml{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.mc{background:#14291c;border:2px solid #1f3a2a;border-radius:10px;overflow:hidden;text-align:left;font-size:12px}
.rc .ml>.mc{flex:0 0 auto}
.mc.cur{border-color:#ffd60a;box-shadow:0 0 10px #ffd60a88}
.tr{display:flex;align-items:center;gap:5px;padding:4px 6px;white-space:nowrap}
.tr+.tr{border-top:1px solid #1f3a2a}
.tr.l{opacity:.45}.tr.w{font-weight:800}.tr.me{background:#ffd60a22}
.tr b{margin-left:auto;padding-left:6px}
.tr i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px #fff8;flex:none}
/* ---- Desafíos ---- */
#clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;padding:2px}
.ch{display:flex;align-items:center;gap:10px;text-align:left;background:#14291c;border:3px solid #1f3a2a;border-radius:12px;padding:8px 10px;cursor:pointer}
.ch .cn{font-family:Impact,'Arial Black',sans-serif;font-style:italic;font-size:22px;color:#ffd60a;min-width:28px;text-align:center}
.ch .ci{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ch .ci b{font-size:14px;letter-spacing:.5px}
.ch .ci small{font-size:11px;opacity:.8;line-height:1.25}
.ch .ci em{font-style:normal;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.ch .lvm{color:#ffd60a}.ch .lvd{color:#ff9a3c}.ch .lve{color:#ff5d73}
.ch .cs{font-size:11px;font-weight:800;text-align:right;white-space:nowrap}
.ch .cs small{display:block;font-weight:600;opacity:.7;font-size:10px}
.ch.open{border-color:#2a4d36}
.ch.open:active{transform:scale(.98)}
.ch.done{border-color:#ffd60a;background:#2a4d36}
.ch.lock{opacity:.5;cursor:not-allowed}
#cwarn{color:#ff9a3c;font-size:12px}
#chint .scroll{max-width:560px;display:flex;flex-direction:column;gap:12px;padding-top:6px}
#hi{line-height:1.6}
/* ---- Selección de equipos (2 jugadores, VS BOT, Desafíos) ---- */
#tprev{display:flex;align-items:stretch;justify-content:center;gap:10px;width:min(560px,100%)}
.slot{flex:1;min-width:0;background:#14291c;border:3px solid #1f3a2a;border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.slot.act{border-color:#ffd60a;box-shadow:0 0 12px #ffd60a88}
.slot small{font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:1px}
.slot b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cp{width:48px;height:48px;border-radius:50%;box-shadow:0 4px 0 #0008}
.cp.q{background:#0a1f12;border:3px dashed #3a5a46;box-shadow:none;display:flex;align-items:center;justify-content:center;color:#3a5a46;font-weight:800}
#tvs{align-self:center;font-family:Impact,'Arial Black',sans-serif;font-style:italic;color:#ffd60a;font-size:20px}
#shint{font-size:13px;min-height:18px}
#rtog button.on{background:#ffd60a;color:#222;box-shadow:0 5px 0 #a08400}
#sgrid .tc.s1{border-color:#6db3ff;background:#1b3550}
#sgrid .tc.s2{border-color:#ff7b7b;background:#4a2427}
#sgrid .tc[data-b]::after{content:attr(data-b);position:absolute;top:2px;right:6px;font-weight:900;color:#ffd60a}
@media (max-height:420px){#tsel h2{display:none}.cp{width:34px;height:34px}.slot small{display:none}}
/* ---- Idioma ---- */
#llist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;padding:2px}
.lg{display:flex;align-items:center;gap:12px;background:#14291c;border:3px solid #1f3a2a;border-radius:12px;padding:12px 14px;cursor:pointer;font-size:17px;font-weight:700;text-align:left}
.lg .fg{font-size:30px;line-height:1}
.lg.on{border-color:#ffd60a;background:#2a4d36}
.lg i{margin-left:auto;color:#ffd60a;font-style:normal}
/* ---- Marcador vertical a la izquierda: SOLO teléfonos móviles en horizontal (clase puesta por JS) ---- */
html.phone-land body{flex-direction:row}
html.phone-land #stage{min-width:0}
html.phone-land #hud{flex:none;flex-direction:column;justify-content:center;align-items:stretch;gap:6px;height:100%;width:clamp(94px,15.2vw,128px);padding:6px 6px;padding-left:max(6px,env(safe-area-inset-left));border-bottom:0;border-right:2px solid #1f3a2a;overflow:hidden}
html.phone-land #tb{order:1}
html.phone-land #trd{order:2;flex-direction:row-reverse}
html.phone-land #mid{order:3;flex:none}
html.phone-land .team{font-size:12px;justify-content:space-between;gap:4px;padding-bottom:2px}
html.phone-land .team b{font-size:22px;padding:0 6px}
html.phone-land .team span{max-width:60px}
html.phone-land #time{font-size:24px}
html.phone-land #turn{display:block;font-size:10px;padding:2px 4px;margin:3px 0}
html.phone-land #row{flex-direction:column;gap:4px;font-size:10px}
html.phone-land #row button{width:100%;padding:3px 4px}
</style>
</head>
<body>
<div id="hud" class="hide">
  <div class="team blue" id="tb"><span id="lb">AZULES</span> <b id="sb">0</b></div>

    <div id="time">2:00</div>
    <div id="turn">Turno: AZULES</div>
    <div id="row">
      <button class="sm" id="bMenu" data-i="menuB">☰ Menú</button>

<div id="tcfg" class="screen tall">

    <div id="tgrid"></div>
  </div>
  <div class="brow">
    <button id="cgo" disabled data-i="cGo"></button>
    <button class="alt" data-go="menu" data-i="back"></button>
  </div>
</div>

<div id="bracket" class="screen tall">
  <h2 data-i="brT"></h2>
  <p id="binfo"></p>

<div id="chal" class="screen tall">

<script>
(()=>{
"use strict";

let sdkPlaying=false;
let sdkTransition=false;

const sdkReady=(async()=>{
  if(!window.PokiSDK)return;
  try{await window.PokiSDK.init();}catch(e){}
  try{window.PokiSDK.gameLoadingFinished();}catch(e){}
})();

function sdkStart(){
  if(sdkPlaying)return;
  sdkPlaying=true;
  try{window.PokiSDK?.gameplayStart();}catch(e){}
}

function sdkStop(){
  if(!sdkPlaying)return;
  sdkPlaying=false;
  try{window.PokiSDK?.gameplayStop();}catch(e){}
}

async function startNewGame(){
  if(sdkTransition)return;
  sdkTransition=true;
  await sdkReady;
  newGame();
  sdkStart();
  sdkTransition=false;
}

function detectLang(){
  let s=null;
  try{s=localStorage.getItem(LKEY);}catch(e){}
  if(s&&LNG[s])return s;
  const ls=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'];
  for(const x of ls){const p=String(x).toLowerCase().slice(0,2);if(LNG[p])return p;}
  return 'en';
}

function shade(h,k){
  const n=parseInt(h.slice(1),16),t=k<0?0:255,a=Math.abs(k);
  return '#'+[n>>16,(n>>8)&255,n&255].map(v=>Math.round(v+(t-v)*a).toString(16).padStart(2,'0')).join('');
}

function lum(h){
  const n=parseInt(h.slice(1),16);
  return(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255;
}

const mk=(x,y,r,im,t)=>({x,y,r,im,vx:0,vy:0,t});
posts=[[0,GY1],[0,GY2],[FW,GY1],[FW,GY2]].map(p=>mk(p[0],p[1],6,0,'post'));
const FORM=[[360,0],[245,-105],[245,105],[130,0]];

function placePieces(){
  caps=[];
  const chal=mode==='chal'&&CH,bl=chal&&CH.def.bl||[0,1,2,3],rl=chal&&CH.def.rl||[0,1,2,3];
  FORM.forEach(([x,dy],i)=>{
    if(bl.includes(i))caps.push(mk(x,CY+dy,RC,.25,'blue'));
    if(rl.includes(i))caps.push(mk(FW-x,CY+dy,RC,.25,'red'));
  });
  ball=mk(FW/2,CY,RB,1,'ball');
  all=caps.concat([ball]);
}

function friction(p,dt){
  const isB=p.t==='ball',k=isB?1.3:2.2,c=isB?30:60;
  let sp=Math.hypot(p.vx,p.vy);
  if(sp===0)return;
  let ns=sp*Math.exp(-k*dt)-c*dt;
  if(ns<8){p.vx=p.vy=0;return;}
  const f=ns/sp;p.vx*=f;p.vy*=f;
  const mx=isB?MAXB:MAXC;
  if(ns>mx){p.vx*=mx/ns;p.vy*=mx/ns;}
}

function collide(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;
  if(d2>=rr*rr)return;
  let d=Math.sqrt(d2),nx,ny;
  if(d<1e-6){nx=1;ny=0;d=0;}else{nx=dx/d;ny=dy/d;}
  const sum=a.im+b.im;
  if(sum===0)return;
  const ov=rr-d;
  a.x-=nx*ov*a.im/sum;a.y-=ny*ov*a.im/sum;
  b.x+=nx*ov*b.im/sum;b.y+=ny*ov*b.im/sum;
  const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(vn<0){
    let e=(a.t==='post'||b.t==='post')?.6:(a.t==='ball'||b.t==='ball')?.85:.8;
    if(-vn<25)e=0;
    const j=-(1+e)*vn/sum;
    a.vx-=j*a.im*nx;a.vy-=j*a.im*ny;
    b.vx+=j*b.im*nx;b.vy+=j*b.im*ny;
  }
}

function wallsCap(p){
  const r=p.r,E=.6;
  if(p.x<r){p.x=r;p.vx=Math.abs(p.vx)*E;}
  if(p.x>FW-r){p.x=FW-r;p.vx=-Math.abs(p.vx)*E;}
  if(p.y<r){p.y=r;p.vy=Math.abs(p.vy)*E;}
  if(p.y>FH-r){p.y=FH-r;p.vy=-Math.abs(p.vy)*E;}
}

function wallsBall(b){
  const r=b.r,E=.8;
  if(b.x<0||b.x>FW){
    if(b.y<GY1+r){b.y=GY1+r;b.vy=Math.abs(b.vy)*E;}
    if(b.y>GY2-r){b.y=GY2-r;b.vy=-Math.abs(b.vy)*E;}
    if(b.x<-GD+r){b.x=-GD+r;b.vx=Math.abs(b.vx)*E;}
    if(b.x>FW+GD-r){b.x=FW+GD-r;b.vx=-Math.abs(b.vx)*E;}
  }else{
    if(b.y<r){b.y=r;b.vy=Math.abs(b.vy)*E;}
    if(b.y>FH-r){b.y=FH-r;b.vy=-Math.abs(b.vy)*E;}
    const mouth=b.y>GY1&&b.y<GY2;
    if(!mouth){
      if(b.x<r){b.x=r;b.vx=Math.abs(b.vx)*E;}
      if(b.x>FW-r){b.x=FW-r;b.vx=-Math.abs(b.vx)*E;}
    }
  }
}

function step(dt){
  for(const p of all){p.x+=p.vx*dt;p.y+=p.vy*dt;friction(p,dt);}
  if(ball.x<-ball.r&&ball.y>GY1&&ball.y<GY2)return 'red';
  if(ball.x>FW+ball.r&&ball.y>GY1&&ball.y<GY2)return 'blue';
  for(let it=0;it<3;it++){
    for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++)collide(all[i],all[j]);
    for(const po of posts)for(const p of all)collide(po,p);
    for(const p of caps)wallsCap(p);
    wallsBall(ball);
  }
  return null;
}

function allStopped(){return all.every(p=>p.vx===0&&p.vy===0);}

function launch(c,px,py){
  const len=Math.hypot(px,py),l=Math.min(len,MAXD);
  c.vx=-px/len*l*SPD;c.vy=-py/len*l*SPD;
  started=true;state='moving';stopT=0;moveT=0;acc=0;
  // Desafíos: se registra el lanzamiento del jugador (no altera la física)
  if(mode==='chal'&&CH&&c.t==='blue'){CH.shots++;shooter=c;touched=false;}else shooter=null;
}

const DIFF={
  easy:{sa:.075,sp:.2,pb:.3,k:6},
  normal:{sa:.035,sp:.09,pb:.6,k:3},
  hard:{sa:.012,sp:.035,pb:.85,k:2}
};

const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)*2;

function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay;
  let t=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1);
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-ax-t*dx,py-ay-t*dy);
}

function evalS(g,moved){
  if(g==='red')return 1e5;
  if(g==='blue')return -1e5;
  let s=-Math.hypot(ball.x,ball.y-CY)+.4*Math.hypot(ball.x-FW,ball.y-CY);
  if(!moved&&ball.x<FW*.5)s-=250;
  if(ball.x>FW*.45){
    let m=1e9;
    for(const c of caps)if(c.t==='red')m=Math.min(m,segDist(c.x,c.y,ball.x,ball.y,FW,CY));
    s-=m*.7;
  }
  return s;
}

function think(){
  const P=DIFF[diff],snap=all.map(p=>[p.x,p.y]),bx=ball.x,by=ball.y,cands=[];
  const restore=()=>all.forEach((p,i)=>{p.x=snap[i][0];p.y=snap[i][1];p.vx=p.vy=0;});
  const targets=[];
  for(const ty of [CY,GY1+28,GY2-28])targets.push([0,ty],[0,-ty],[0,2*FH-ty]);
  const gl=Math.hypot(bx-FW,by-CY)||1,tdx=FW+(bx-FW)/gl*140,tdy=CY+(by-CY)/gl*140;
  for(const c of caps){
    if(c.t!=='red')continue;
    const dirs=[];
    for(const [tx,ty] of targets){
      let dx=tx-bx,dy=ty-by;
      const d=Math.hypot(dx,dy)||1;
      dx/=d;dy/=d;
      dirs.push([Math.atan2(by-dy*(RC+RB)-c.y,bx-dx*(RC+RB)-c.x),[.5,.75,1]]);
    }
    const ab=Math.atan2(by-c.y,bx-c.x);
    dirs.push([ab-.1,[.6,1]],[ab,[.6,1]],[ab+.1,[.6,1]]);
    dirs.push([Math.atan2(tdy-c.y,tdx-c.x),[.15,.25,.4]]);
    for(const [ang,fs] of dirs)for(const f of fs){
      const l=f*MAXD;restore();
      c.vx=Math.cos(ang)*l*SPD;c.vy=Math.sin(ang)*l*SPD;
      let g=null,moved=false;
      for(let i=0;i<600&&!g;i++){
        g=step(DT);
        if(ball.vx||ball.vy)moved=true;
        if(i%30===29&&allStopped())break;
      }
      cands.push({c,ang,l,s:evalS(g,moved)+Math.random()*15});
    }
  }
  restore();
  cands.sort((a,b)=>b.s-a.s);
  const idx=Math.random()<P.pb?0:1+Math.floor(Math.random()*(P.k-1));
  const ch=cands[Math.min(idx,cands.length-1)];
  const ang=ch.ang+gauss()*P.sa;
  const l=Math.max(30,Math.min(MAXD,ch.l*(1+gauss()*P.sp)));
  return{c:ch.c,px:-Math.cos(ang)*l,py:-Math.sin(ang)*l};
}

function botUpdate(dt){
  botT+=dt;
  if(!bot&&botT>.7){bot=think();botT=0;}
  if(bot){
    const k=Math.min(1,botT/.6),e=k*k*(3-2*k);
    drag={c:bot.c,sx:bot.c.x,sy:bot.c.y,x:bot.c.x+bot.px*e,y:bot.c.y+bot.py*e,id:-1};
    if(k>=1){
      const d=bot;bot=null;drag=null;botT=0;
      launch(d.c,d.px,d.py);
    }
  }
}

  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));

function newGame(){
  const ch=mode==='chal'&&CH,st=ch&&CH.def.st||[0,0];
  score={blue:st[0],red:st[1]};time=matchTime();started=false;golden=false;goldT=0;
  chLs=null;shooter=null;touched=false;
  if(ch){CH.shots=0;CH.miss=0;}
  turn=isBot()?'blue':(Math.random()<.5?'blue':'red');
  state='aim';drag=null;stopT=0;moveT=0;goalT=0;acc=0;bot=null;botT=0;
  if(mode==='tour'&&T){
    const a=TEAMS[T.team],b=TEAMS[curOpp];
    TC.blue=a[2];TC.red=b[2];
    TN.blue=upName(T.team);TN.red=upName(curOpp);
    TF.blue=fl(a[1]);TF.red=fl(b[1]);
  }else if((mode==='two'||mode==='bot'||mode==='chal')&&SEL.a>=0&&SEL.b>=0){
    const a=TEAMS[SEL.a],b=TEAMS[SEL.b];
    TC.blue=a[2];TC.red=b[2];
    TN.blue=upName(SEL.a);TN.red=upName(SEL.b);
    TF.blue=fl(a[1]);TF.red=fl(b[1]);
  }else{TC.blue=TC.red=null;}
  placePieces();show(null);$('hud').classList.remove('hide');ui();
}

function leave(id){
  sdkStop();
  CH=null;
  state='menu';drag=null;bot=null;botT=0;TC.blue=TC.red=null;shooter=null;
  placePieces();score={blue:0,red:0};time=GAME_TIME;turn='blue';golden=false;goldT=0;
  $('hud').classList.add('hide');show(id);ui();
}

function toMenu(){leave('menu');}
function nextTurn(){turn=turn==='blue'?'red':'blue';state='aim';stopT=0;moveT=0;bot=null;botT=0;}

function chShotEnd(){ // cierra el lanzamiento del jugador: si su chapa no tocó el balón, cuenta como fallo
  if(shooter){if(!touched)CH.miss++;shooter=null;}
}

function goal(scorer){
  const was=score.blue>score.red;
  score[scorer]++;
  if(mode==='chal'&&CH){
    chShotEnd();
    const now=score.blue>score.red;
    if(now&&!was)chLs=time; // segundos restantes cuando el azul tomó la ventaja que mantiene
    else if(!now)chLs=null;
  }
  state='goal';goalT=1.4;goalMsg=tt('gol',nm(scorer));
  turn=scorer==='blue'?'red':'blue';bot=null;botT=0;
  ui();
}

function endGame(){
  sdkStop();
  state='over';drag=null;bot=null;
  if(mode==='chal'&&CH){chFinish();return;}
  const b=score.blue,r=score.red;
  let ti,c;
  if(b===r){ti=tt('draw');c='#fff';}
  else if(mode==='tour'){ti=tt(b>r?'vict':'defe');c=b>r?'#6db3ff':'#ff7b7b';}
  else if(mode==='bot'){ti=tt(b>r?'youW':'botW');c=b>r?'#6db3ff':'#ff7b7b';}
  else{ti=tt('winT',nm(b>r?'blue':'red'));c=b>r?'#6db3ff':'#ff7b7b';}
  $('endT').textContent=ti;$('endT').style.color=c;
  $('endS').textContent=nm('blue')+' '+b+' - '+r+' '+nm('red')+(golden?' · '+tt('gold'):'');
  const tr=mode==='tour';
  $('again').style.display=tr?'none':'';
  $('cont').style.display=tr?'':'none';
  $('again').textContent=tt('again');$('cont').textContent=tt('viewB');
  if(tr&&b!==r)tRecord(b,r);
  show('end');
}

function update(dt){
  if(goldT>0)goldT-=dt;
  if(state==='goal'){
    goalT-=dt;
    if(goalT<=0){
      if(golden||score.blue>=winOf('blue')||score.red>=winOf('red'))endGame();
      else{placePieces();state='aim';stopT=0;moveT=0;}
    }
    return;
  }
  if(state!=='aim'&&state!=='moving')return;
  if(started&&!golden){
    time-=dt;
    if(time<=0){
      time=0;ui();
      if(mode==='tour'&&score.blue===score.red){golden=true;goldT=2.2;}
      else{endGame();return;}
    }
  }
  if(state==='aim'&&isBot()&&turn==='red')botUpdate(dt);
  if(state==='moving'){
    moveT+=dt;acc+=dt;let n=0;
    while(acc>=DT&&n++<40){
      const g=step(DT);acc-=DT;
      if(shooter&&!touched&&Math.hypot(shooter.x-ball.x,shooter.y-ball.y)<=shooter.r+ball.r+.6)touched=true;
      if(g){goal(g);acc=0;return;}
    }
    if(n>=40)acc=0;
    if(allStopped()){stopT+=dt;if(stopT>.2){chShotEnd();nextTurn();}}else stopT=0;
    if(moveT>15){for(const p of all)p.vx=p.vy=0;}
  }
}

function pos(e){
  const r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)*CW/r.width-GD,y:(e.clientY-r.top)*CH_/r.height-M};
}

cv.addEventListener('pointerdown',e=>{
  if(state!=='aim'||drag||(isBot()&&turn==='red'))return;
  const p=pos(e);let best=null,bd=1e9;
  for(const c of caps){
    if(c.t!==turn)continue;
    const d=Math.hypot(c.x-p.x,c.y-p.y);
    if(d<c.r+18&&d<bd){bd=d;best=c;}
  }
  if(!best)return;
  drag={c:best,sx:p.x,sy:p.y,x:p.x,y:p.y,id:e.pointerId};
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
});

cv.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const p=pos(e);drag.x=p.x;drag.y=p.y;e.preventDefault();
});

cv.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const p=pos(e),d=drag;drag=null;
  if(state!=='aim')return;
  const px=p.x-d.sx,py=p.y-d.sy;
  if(Math.hypot(px,py)<10)return;
  launch(d.c,px,py);
});

cv.addEventListener('pointercancel',e=>{
  if(drag&&e.pointerId===drag.id)drag=null;
});

cv.addEventListener('contextmenu',e=>e.preventDefault());

document.addEventListener('touchmove',e=>{
  if(!e.target.closest||!e.target.closest('.scroll'))e.preventDefault();
},{passive:false});

function drawField(){
  ctx.fillStyle='#0d3b1e';ctx.fillRect(-GD,-M,CW,CH_);
  const n=14,w=FW/n;
  for(let i=0;i<n;i++){
    ctx.fillStyle=i%2?'#2c9246':'#32a04d';
    ctx.fillRect(i*w,0,w+1,FH);
  }
  ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.strokeRect(0,0,FW,FH);
  ctx.beginPath();ctx.moveTo(FW/2,0);ctx.lineTo(FW/2,FH);ctx.stroke();
  ctx.beginPath();ctx.arc(FW/2,CY,90,0,7);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(FW/2,CY,5,0,7);ctx.fill();
  for(const s of [0,1]){
    const f=s?-1:1,x0=s?FW:0;
    ctx.strokeRect(s?FW-165:0,CY-200,165,400);
    ctx.strokeRect(s?FW-55:0,CY-110,55,220);
    ctx.beginPath();ctx.arc(x0+f*115,CY,5,0,7);ctx.fill();
    const a=Math.acos(50/80);ctx.beginPath();
    if(!s)ctx.arc(115,CY,80,-a,a);
    else ctx.arc(FW-115,CY,80,Math.PI-a,Math.PI+a);
    ctx.stroke();
  }
  for(const s of [0,1]){
    const x=s?FW:-GD;
    ctx.fillStyle='rgba(255,255,255,.14)';
    ctx.fillRect(x,GY1,GD,GY2-GY1);
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;ctx.beginPath();
    for(let i=0;i<=GD;i+=10){ctx.moveTo(x+i,GY1);ctx.lineTo(x+i,GY2);}
    for(let y=GY1;y<=GY2;y+=10){ctx.moveTo(x,y);ctx.lineTo(x+GD,y);}
    ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(x,GY1,GD,GY2-GY1);
  }
  ctx.fillStyle='#fff';
  for(const p of posts){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
}

function drawCap(c,t){
  const hx=TC[c.t];let col,bd,ir='rgba(255,255,255,.4)';
  if(hx){
    const lm=lum(hx);
    col=[shade(hx,.4),hx,shade(hx,-.35)];
    bd=lm>.6?'#2b2b2b':lm<.3?'#e8e8e8':shade(hx,-.5);
    if(lm>.6)ir='rgba(0,0,0,.28)';
  }else{
    col=c.t==='blue'?['#8cc4ff','#1e63d6','#0a3585']:['#ff9a9a','#d62828','#7a0c0c'];
    bd=col[2];
  }
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.ellipse(c.x+4,c.y+6,c.r,c.r*.9,0,0,7);ctx.fill();
  if(c.t===turn&&(state==='aim'||state==='moving')){
    ctx.shadowColor='#ffe600';ctx.shadowBlur=14+3*Math.sin(t*5);
    ctx.strokeStyle='#ffe600';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(c.x,c.y,c.r+5,0,7);ctx.stroke();
    ctx.shadowBlur=0;
  }
  const g=ctx.createRadialGradient(c.x-8,c.y-8,2,c.x,c.y,c.r);
  g.addColorStop(0,col[0]);g.addColorStop(.6,col[1]);g.addColorStop(1,col[2]);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,7);ctx.fill();
  ctx.strokeStyle=bd;ctx.lineWidth=3;ctx.stroke();
  ctx.strokeStyle=ir;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(c.x,c.y,c.r*.58,0,7);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath();ctx.ellipse(c.x-8,c.y-9,6,3.5,-.7,0,7);ctx.fill();
  ctx.restore();
}

function drawBall(b){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.ellipse(b.x+3,b.y+4,b.r,b.r*.9,0,0,7);ctx.fill();
  const g=ctx.createRadialGradient(b.x-4,b.y-4,1,b.x,b.y,b.r);
  g.addColorStop(0,'#fff');g.addColorStop(1,'#d4d4d4');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
  ctx.strokeStyle='#8a8a8a';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#555';ctx.beginPath();ctx.arc(b.x,b.y,b.r*.32,0,7);ctx.fill();
  ctx.restore();
}

function drawAim(){
  if(!drag)return;
  const c=drag.c;let px=drag.x-drag.sx,py=drag.y-drag.sy;
  const len=Math.hypot(px,py);
  if(len<1)return;
  const l=Math.min(len,MAXD),ux=px/len,uy=py/len;
  ctx.save();ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(c.x+ux*l,c.y+uy*l);ctx.stroke();
  ctx.restore();
}

function draw(t){
  ctx.setTransform(cv.width/CW,0,0,cv.height/CH_,0,0);
  ctx.translate(GD,M);
  drawField();
  for(const c of caps)drawCap(c,t);
  drawBall(ball);
  drawAim();
  if(state==='goal'||goldT>0){
    const m=state==='goal'?goalMsg:tt('gold');
    ctx.save();ctx.font='900 80px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=8;ctx.strokeStyle='#000a';ctx.strokeText(m,FW/2,CY);
    ctx.fillStyle='#ffe600';ctx.fillText(m,FW/2,CY);ctx.restore();
  }
}

function cp(i){
  if(i<0)return '<div class="cp q">?</div>';
  const h=TEAMS[i][2],lm=lum(h),bd=lm>.6?'#2b2b2b':lm<.3?'#e8e8e8':shade(h,-.5);
  return '<div class="cp" style="background:radial-gradient(circle at 35% 30%,'+shade(h,.4)+','+h+' 60%,'+shade(h,-.35)+');border:3px solid '+bd+'"></div>';
}
function openSel(kind){
  SEL={a:-1,b:-1,rnd:kind!=='two',act:0,kind};
  paintSel();show('tsel');
}
function reroll(){
  if(SEL.a<0){SEL.b=-1;return;}
  const c=[...Array(32).keys()].filter(x=>x!==SEL.a);
  SEL.b=c[Math.floor(Math.random()*c.length)];
}
function paintSel(){
  const s=SEL,two=s.kind==='two',act=(!two&&s.rnd)?0:s.act;
  $('tsT').textContent=tt(two?'sT2':s.kind==='bot'?'sTB':'sTC');
  const slot=(k,lab,i)=>'<div class="slot'+(act===k?' act':'')+'" data-s="'+k+'"><small>'+lab+'</small>'+cp(i)+'<b>'+(i<0?'?':fl(TEAMS[i][1])+' '+tname(i))+'</b></div>';
  $('tprev').innerHTML=slot(0,tt(two?'p1':'you'),s.a)+'<span id="tvs">VS</span>'+slot(1,tt(two?'p2':'rv'),s.b);
  $('shint').textContent=(!two&&s.rnd)?(s.a<0?tt('hY'):'🎲 '+tt('rndT')):act===0?tt(two?'h1':'hY'):tt(two?'h2':'hB');
  $('rtog').style.display=two?'none':'';
  $('rpick').classList.toggle('on',!s.rnd);$('rrnd').classList.toggle('on',s.rnd);
  document.querySelectorAll('#sgrid .tc').forEach(el=>{
    const i=+el.dataset.i;
    el.classList.toggle('s1',s.a===i);el.classList.toggle('s2',s.b===i);
    if(s.a===i)el.dataset.b='1';else if(s.b===i)el.dataset.b='2';else delete el.dataset.b;
  });
  $('sgo').disabled=!(s.a>=0&&s.b>=0);
}
function selPick(i){
  const s=SEL,two=s.kind==='two',slot=(!two&&s.rnd)?0:s.act,other=slot===0?s.b:s.a;
  if(i===other)return; // un equipo ya elegido por el otro lado no se puede repetir
  if(slot===0){
    s.a=i;
    if(!two&&s.rnd)reroll();
    else if(s.b<0)s.act=1;
  }else s.b=i;
  paintSel();
}
$('sgrid').addEventListener('click',e=>{
  const c=e.target.closest('.tc');
  if(c)selPick(+c.dataset.i);
});
$('tprev').addEventListener('click',e=>{
  const c=e.target.closest('.slot');
  if(!c)return;
  const k=+c.dataset.s;
  if(SEL.kind!=='two'&&SEL.rnd)return;
  SEL.act=k;paintSel();
});
$('rpick').addEventListener('click',()=>{SEL.rnd=false;SEL.b=-1;SEL.act=SEL.a>=0?1:0;paintSel();});
$('rrnd').addEventListener('click',()=>{SEL.rnd=true;SEL.act=0;reroll();paintSel();});
$('sgo').addEventListener('click',()=>{

  if(SEL.kind==='two'){mode='two';startNewGame();}

});

});

// ---------- Torneo (lógica sin cambios; solo se traducen los textos) ----------
function tSave(){
  try{localStorage.setItem(SKEY,JSON.stringify(T));}catch(e){}
}

function tLoad(){
  try{
    const s=localStorage.getItem(SKEY);
    T=s?JSON.parse(s):null;
  }catch(e){T=null;}
  if(T&&!(T.draw&&T.draw.length===32&&T.res&&T.sc&&TEAMS[T.team]))T=null;
}

const tParts=r=>r===0?T.draw:T.res[r-1];

function tMatch(){
  const p=tParts(T.round);
  for(let k=0;k<p.length;k+=2){
    if(p[k]===T.team||p[k+1]===T.team){
      return{i:k/2,opp:p[k]===T.team?p[k+1]:p[k]};
    }
  }
  return null;
}

function tSim(r){
  const p=tParts(r);
  for(let i=0;i<p.length/2;i++){
    if(T.res[r][i]>=0)continue;
    const a=p[2*i],b=p[2*i+1];
    const wa=Math.pow(34-a,1.5),wb=Math.pow(34-b,1.5);
    const aw=Math.random()<wa/(wa+wb);
    const g=T.goals,l=Math.floor(Math.random()*g);
    T.res[r][i]=aw?a:b;
    T.sc[r][i]=aw?[g,l]:[l,g];
  }
}

function tRecord(b,r){
  const rd=T.round,m=tMatch(),p=tParts(rd),meA=p[2*m.i]===T.team,win=b>r;
  T.res[rd][m.i]=win?T.team:m.opp;
  T.sc[rd][m.i]=meA?[b,r]:[r,b];
  tSim(rd);
  if(win){
    if(rd===4)T.champ=true;
    else T.round=rd+1;
  }else{
    T.out=rd;
    for(let x=rd+1;x<5;x++)tSim(x);
  }
  tSave();
}

function tStart(){
  if(CFG.sel<0)return;
  const d=[...Array(32).keys()];
  for(let i=31;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [d[i],d[j]]=[d[j],d[i]];
  }
  T={
    team:CFG.sel,diff:CFG.diff,time:CFG.time,goals:CFG.goals,draw:d,
    res:[16,8,4,2,1].map(n=>Array(n).fill(-1)),
    sc:[16,8,4,2,1].map(n=>Array(n).fill(null)),
    round:0,out:-1,champ:false
  };
  tSave();showBracket();
}

function tPlay(){
  const m=tMatch();
  if(!m)return;
  curOpp=m.opp;mode='tour';diff=T.diff;
  startNewGame();
}

function mRow(id,g,cls){
  if(id==null||id<0)return '<div class="tr"><i style="background:#555"></i>'+tt('tbd')+'</div>';
  const x=TEAMS[id];
  return '<div class="tr '+cls+(id===T.team?' me':'')+'"><i style="background:'+x[2]+'"></i>'+fl(x[1])+' '+tname(id)+'<b>'+(g==null?'':g)+'</b></div>';
}

function renderBracket(){
  const me=TEAMS[T.team],alive=T.out<0&&!T.champ;
  $('binfo').textContent=tt('bInfo',fl(me[1])+' '+tname(T.team),dn(T.diff),T.time/60,goalsTxt(T.goals));
  let h='';
  for(let r=0;r<5;r++){
    const p=tParts(r),n=16>>r;
    let ms='';
    for(let i=0;i<n;i++){
      const a=p[2*i],b=p[2*i+1],w=T.res[r][i],s=T.sc[r][i]||[null,null];
      const cur=alive&&r===T.round&&(a===T.team||b===T.team);
      ms+='<div class="mc'+(cur?' cur':'')+'">'+mRow(a,s[0],w<0?'':a===w?'w':'l')+mRow(b,s[1],w<0?'':b===w?'w':'l')+'</div>';
    }
    h+='<div class="rc" data-r="'+r+'"><h4>'+rn(r)+'</h4><div class="ml">'+ms+'</div></div>';
  }
  const ch=T.res[4][0];
  h+='<div class="rc" data-r="5"><h4>'+tt('champ')+'</h4><div class="ml"><div class="mc'+(ch>=0?' cur':'')+'">'+(ch>=0?mRow(ch,null,'w'):mRow(-1))+'</div></div></div>';
  $('bk').innerHTML=h;
  const st=$('bstat');
  if(T.champ)st.textContent=tt('champY');
  else if(T.out>=0){
    const c=TEAMS[T.res[4][0]];
    st.textContent=tt('elim',rn(T.out),fl(c[1])+' '+tname(T.res[4][0]));
  }else{
    const oi=tMatch().opp,o=TEAMS[oi];
    st.textContent=tt('rInfo',rn(T.round),fl(o[1])+' '+tname(oi));
  }
  $('bplay').style.display=alive?'':'none';
  $('bplay').textContent=alive?tt('play',rn(T.round)):'';
  const col=$('bk').querySelector('.rc[data-r="'+(alive?T.round:4)+'"]');
  $('bbox').scrollLeft=col?Math.max(0,$('bbox').scrollLeft+col.getBoundingClientRect().left-$('bk').getBoundingClientRect().left-12):0;
}

{lv:'E',bd:['hard'],win:3,time:120,ok:R=>R.b>R.r&&R.r===0,m:'t',th:[30,60]},
{lv:'M',bd:['normal','normal'],win:3,time:120,ok:R=>R.b>R.r,m:'d',th:[3,5]},
{lv:'E',bd:['easy','normal','hard'],win:3,time:120,ok:R=>R.b>R.r,m:'d',th:[4,7]},
{lv:'M',bd:['normal'],win:[99,1],time:120,xf:'xFull',ok:R=>R.r===0,m:'d',th:[1,3]},
{lv:'E',bd:['hard'],win:5,time:180,ok:R=>R.b-R.r>=3,m:'d',th:[4,5]}
];
const MED=['','🥉','🥈','🥇'];
const fmtT=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

try{localStorage.setItem('chapix_t','1');localStorage.removeItem('chapix_t');}catch(e){storeOK=false;}
function pLoad(){
  try{const s=localStorage.getItem(CKEY);if(s)PROG=JSON.parse(s)||{};}catch(e){}
}
function pSave(){
  try{localStorage.setItem(CKEY,JSON.stringify(PROG));storeOK=true;}catch(e){storeOK=false;}
}

function renderChal(){
  const done=Object.keys(PROG).length,cnt=[0,0,0,0];
  for(const k in PROG)cnt[PROG[k]]++;
  $('cprog').textContent=tt('prog',done,CHS.length,cnt[1],cnt[2],cnt[3]);
  $('cwarn').style.display=storeOK?'none':'';
  $('clist').innerHTML=CHS.map((c,i)=>{
    const m=PROG[i],un=i<=done+2,st=m?'done':un?'open':'lock';
    const tag=m?MED[m]+' '+tt('sDone'):un?tt('sOpen'):'🔒 '+tt('sLock')+'<small>'+tt('sMore',i-2-done)+'</small>';
    const lc={M:'m',D:'d',E:'e'}[c.lv],x=chT(i);
    return '<div class="ch '+st+'" data-i="'+i+'"><span class="cn">'+(i+1)+'</span><div class="ci"><b>'+x[0]+'</b><small>'+x[1]+'</small><em class="lv'+lc+'">'+tt('lv'+c.lv)+'</em></div><span class="cs">'+tag+'</span></div>';
  }).join('');
}
function showChal(){leave('chal');renderChal();}
function openChal(){pLoad();showChal();}

function medTxt(c,k){
  const v=c.th[k],sd=c.bd.length>1;
  return c.m==='d'?tt(sd?'mDt':'mD',v):c.m==='t'?tt('mT',v):c.m==='s'?tt('mS',-v):tt('mL',-v);
}
function xNote(c){
  const p=[];
  if(c.st)p.push(tt('xInit',c.st[0],c.st[1]));
  if(typeof c.win==='number')p.push(tt('xTo',c.win));
  if(c.bd.length>1)p.push(tt('xSer',c.bd.length));
  if(c.xf)p.push(tt(c.xf));
  return p.join(' · ');
}
function chIntro(i){
  chIdx=i;const c=CHS[i],sd=c.bd.length>1,x=chT(i);
  $('hn').textContent=(i+1)+'. '+x[0];
  $('hd').textContent=x[1];
  $('hi').innerHTML=tt('hDiff')+': <b>'+tt('lv'+c.lv)+'</b><br>'+tt('hBot')+': '+c.bd.map(dn).join(' → ')+' · '+tt('hTime')+': '+fmtT(c.time)+(sd?' '+tt('hPer'):'')+'<br>'+xNote(c);
  $('hm').textContent=tt('mLine',medTxt(c,0),medTxt(c,1));
  show('chint');
}
function chBegin(i){CH={def:CHS[i],i,round:0,sb:0,sr:0,shots:0,miss:0,next:false};chRound();}
function chRound(){mode='chal';diff=CH.def.bd[CH.round];startNewGame();}
function chCont(){if(CH&&CH.next){CH.round++;chRound();}else showChal();}

function chFinish(){ // comprueba el objetivo con los datos reales de la partida
  const c=CH.def,n=c.bd.length,last=CH.round>=n-1;
  const R={b:score.blue,r:score.red,t:Math.max(0,time),shots:CH.shots,miss:CH.miss,ls:chLs};
  const win=!!c.ok(R);
  CH.sb+=R.b;CH.sr+=R.r;CH.next=false;
  let ti,col,s=chT(CH.i)[0]+' · '+nm('blue')+' '+R.b+' - '+R.r+' '+nm('red');
  $('again').style.display='';$('cont').style.display='';
  if(win&&!last){
    ti=tt('mOk',CH.round+1,n);col='#6db3ff';CH.next=true;
    $('again').style.display='none';$('cont').textContent=tt('nextM');
  }else{
    if(win){
      const v=c.m==='d'?(n>1?CH.sb-CH.sr:R.b-R.r):c.m==='t'?R.t:c.m==='s'?-R.shots:-(R.ls==null?99:R.ls);
      const m=v>=c.th[1]?3:v>=c.th[0]?2:1;
      if(m>(PROG[CH.i]||0)){PROG[CH.i]=m;pSave();}
      ti=tt('chOk');col='#6db3ff';s+=' · '+MED[m];
    }else{ti=tt('chFail');col='#ff7b7b';}
    if(c.m==='s')s+=tt('shots',R.shots,R.miss);
    if(!storeOK)s+=tt('noSave');
    $('again').textContent=tt('retry');$('cont').textContent=tt('seeC');
  }
  $('endT').textContent=ti;$('endT').style.color=col;$('endS').textContent=s;
  show('end');
}

$('clist').addEventListener('click',e=>{
  const c=e.target.closest('.ch');
  if(c&&!c.classList.contains('lock'))chIntro(+c.dataset.i);
});
$('hgo').addEventListener('click',()=>openSel('chal'));
$('hback').addEventListener('click',showChal);
$('cont').addEventListener('click',()=>{
  if(mode==='chal'&&CH)chCont();
  else if(T)showBracket();
  else toMenu();
});

function loop(ms){
  const t=ms/1000,dt=Math.min(.1,last?t-last:0);
  last=t;
  update(dt);ui();draw(t);
  requestAnimationFrame(loop);
}

LANG=detectLang();
refreshLang();
layout();placePieces();ui();fit();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
